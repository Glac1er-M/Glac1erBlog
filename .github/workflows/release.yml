name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check site
        run: pnpm check

      - name: Build site
        run: pnpm build

      - name: Build CMS
        run: pnpm --dir cms build

      - name: Create Zip Archive
        run: |
          zip -r release.zip . \
            -x "*.git*" ".github/*" \
               "node_modules/*" "cms/node_modules/*" \
               "dist/*" "cms/dist/*" "release.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
          body: "Release of version ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}